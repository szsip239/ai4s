<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI4S</title>
  <style>/* card styles */</style>
</head>
<body>
  <main class="card">
    <div class="content"></div>
    <button class="open-page" type="button">打开应用页</button>
  </main>
  <script type="module">
    /* card view */

    const widget = window.MosaicWidget
    const card = document.querySelector('.card')
    const content = card.querySelector('.content')
    const openPage = card.querySelector('.open-page')
    let data = widget.data.main
    let privacy = widget.presentation.privacy

    function fitRankings() {
      const sections = Array.from(card.querySelectorAll('.keys, .models')).reverse()
      for (const section of sections) section.hidden = false
      for (const section of sections) {
        if (card.scrollHeight > card.clientHeight) section.hidden = true
      }
    }

    function render() {
      content.innerHTML = renderCard(data, privacy)
      fitRankings()
    }

    openPage.addEventListener('click', () => widget.emitIntent('mosaic.external-app.open', {}))

    const resize = new ResizeObserver(fitRankings)
    resize.observe(card)
    render()

    const unsub = [
      widget.onDataChange((next) => { data = next.main; render() }),
      widget.onPresentationChange((next) => {
        if (privacy !== next.privacy) {
          privacy = next.privacy
          render()
        }
      }),
    ]
    window.addEventListener('pagehide', () => {
      resize.disconnect()
      for (const stop of unsub) stop()
    }, { once: true })
  </script>
</body>
</html>
