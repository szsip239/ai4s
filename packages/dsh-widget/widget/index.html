<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI4S</title>
  <style>/* card styles */</style>
</head>
<body>
  <main class="card">
    <div class="content"></div>
    <button class="open-page" type="button">打开应用页</button>
  </main>
  <script type="module">
    /* card view */

    const widget = window.MosaicWidget
    const card = document.querySelector('.card')
    const content = card.querySelector('.content')
    const openPage = card.querySelector('.open-page')
    let data = widget.data.main
    let privacy = widget.presentation.privacy

    const compact = matchMedia('(max-width: 150px)')

    function fitChannels() {
      const more = content.querySelector('.channels .more')
      if (!more) return
      const list = more.parentElement
      const rows = Array.from(list.children).slice(0, -1)
      for (const row of rows) row.hidden = false
      more.hidden = true
      if (!compact.matches || rows.length < 2) return

      const needed = list.offsetHeight
      const room = Math.min(128, needed - (content.scrollHeight - content.clientHeight))
      if (needed <= room) return
      more.textContent = `+${rows.length}`
      more.hidden = false
      let remaining = Math.max(rows[0].offsetHeight, room - more.offsetHeight)
      let shown = 0
      for (const row of rows) {
        if (row.offsetHeight > remaining) break
        remaining -= row.offsetHeight
        shown++
      }
      for (const row of rows.slice(shown)) row.hidden = true
      more.textContent = `+${rows.length - shown}`
    }

    function fitCard() {
      fitChannels()
      const keys = content.querySelector('.keys')
      if (keys) {
        keys.hidden = false
        keys.hidden = content.scrollHeight > content.clientHeight
      }
    }

    function render() {
      content.innerHTML = renderCard(data, privacy)
      fitCard()
    }

    openPage.addEventListener('click', () => widget.emitIntent('mosaic.external-app.open', {}))

    const resize = new ResizeObserver(fitCard)
    resize.observe(card)
    render()

    const unsub = [
      widget.onDataChange((next) => { data = next.main; render() }),
      widget.onPresentationChange((next) => {
        if (privacy !== next.privacy) {
          privacy = next.privacy
          render()
        }
      }),
    ]
    window.addEventListener('pagehide', () => {
      resize.disconnect()
      for (const stop of unsub) stop()
    }, { once: true })
  </script>
</body>
</html>
