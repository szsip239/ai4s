<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI4S</title>
  <style>/* card fonts */
/* card styles */</style>
</head>
<body>
  <main class="ai4s"></main>
  <script type="module">
    /* card view */

    const widget = window.MosaicWidget
    const card = document.querySelector('.ai4s')
    let data = widget.data.main
    let compact = false
    let laneLimit = 1

    const resize = new ResizeObserver(() => {
      const body = card.querySelector('.ai4s-body')
      const lanes = body.querySelector('.ai4s-lanes')
      const narrow = body.clientWidth < 240
      const limit = lanes ? Math.max(1, Math.floor((lanes.clientHeight - 40) / 34)) : 1
      if (compact === narrow && laneLimit === limit) return
      compact = narrow
      laneLimit = limit
      render()
    })

    function render() {
      resize.disconnect()
      card.innerHTML = renderCard(data, { compact, laneLimit })
      resize.observe(card.querySelector('.ai4s-body'))
      const lanes = card.querySelector('.ai4s-lanes')
      if (lanes) resize.observe(lanes)
    }

    card.addEventListener('click', (event) => {
      event.target.closest('.ai4s-note > button')?.parentElement.toggleAttribute('data-open')
    })
    card.addEventListener('focusout', (event) => {
      event.target.closest('.ai4s-note')?.removeAttribute('data-open')
    })
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') event.target.closest('.ai4s-note')?.removeAttribute('data-open')
    })

    render()
    const stop = widget.onDataChange((next) => { data = next.main; render() })
    window.addEventListener('pagehide', () => {
      resize.disconnect()
      stop()
    }, { once: true })
  </script>
</body>
</html>
