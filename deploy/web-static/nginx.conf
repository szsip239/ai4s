server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html 禁启发式缓存（issue #41）：部署后浏览器须回源 revalidate 拿新入口，
  # 否则无 Cache-Control 时浏览器按 Last-Modified 启发式缓存旧页面。
  # no-cache ≠ no-store：每次回源但 ETag/Last-Modified 命中仍 304，不牺牲条件请求。
  # SPA fallback 经 try_files 内部重定向到 /index.html，同样命中本精确块（/ 经 index 指令亦内部重定向至此）。
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # SW 与 manifest 必须实时：sw.js 更新检测依赖每次回源拿新字节，
  # manifest 图标/名称改动同样需要立即生效（同 no-cache 语义，304 仍可用）
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    # nginx 默认 mime.types 无 webmanifest 映射，显式声明（Chrome 容忍 octet-stream，但按规范走）
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback：TanStack Router history 模式，未命中路径回退 index.html
  # hash 资产（/assets/）不加缓存头——文件名带内容哈希，保持默认行为（启发式缓存对不可变资产安全）
  location / {
    try_files $uri $uri/ /index.html;
  }
}
