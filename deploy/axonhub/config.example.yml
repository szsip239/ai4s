# axonhub 运行时配置示例（issue #14 SSO）。
# 复制为 config.yml 并填入实值；config.yml 含 client_secret，已 gitignore，不得入库。
server:
  public_url: http://localhost:3000

oidc:
  providers:
    - id: casdoor
      name: casdoor
      display_name: Casdoor SSO（飞书）
      # Casdoor 全局 issuer（= casdoor app.conf 的 origin），必须让「浏览器」与「axonhub 容器」
      # 用同一个 URL 可达。casdoor 8000 仅绑 127.0.0.1（2026-09-03 起），纯 localhost 下
      # 浏览器通、容器内不通——因此 SSO 需走域名 + 反代（或自行加 extra_hosts/hosts 映射）。
      # 不用 SSO 时本地账号登录即可，无需 nginx/域名。
      issuer_url: https://<sso-domain>
      client_id: REPLACE_WITH_CASDOOR_APP_CLIENT_ID
      client_secret: REPLACE_WITH_CASDOOR_APP_CLIENT_SECRET
      jit_enabled: true
      auto_link_by_email: true
      require_email_verified: false
      enable_pkce: true
      # axonhub OIDC 端点在 /oauth/oidc/*（不是 /oidc/*）
      redirect_url: http://localhost:3000/oauth/oidc/callback
      oidc_login_only: false
      group_claims: [groups]
      # JIT 兜底姿态（未匹配部门映射时）：系统档为空——最小权限（issue #68 权限根修）。
      # QA 实测（docs/tests/2026-08-20-full-qa-report.md）：axonhub v1.0.0-beta6 ent privacy 对系统档
      # 直接全局 Allow 且无属主约束，read_users/read_api_keys/write_api_keys 曾致员工可枚举全员邮箱、
      # 横读全项目 key 明文、自助提额。key/request 能力一律改经项目级 user_projects.scopes 下发
      # （deploy/scripts/assign-default-project.sh，首登后补 Default 项目成员时附带），不在系统档出现。
      # 注意 sync_role_strategy=create_only：本项只影响新 JIT 用户，存量用户须另行收窄（见 issue #68 SQL）。
      # 部门映射（role_mappings）待飞书侧补 contact/部门 scope 后再配。
      default_scopes: []
      sync_role_strategy: create_only
