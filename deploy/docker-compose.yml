# ai4s 阶段 0 全链路 tracer bullet
# 链路：员工 curl/CLI → agentgateway(:3000) → axonhub(:8090) → OAuth 订阅上游（或 mock 上游）
# 版本纪律（ADR-0002）：镜像 tag 显式 pin，不跟 latest/unstable；升级走评审。
#
# 用法：
#   cp .env.example .env   # 填入 DB_PASSWORD 与管理面账号
#   docker compose up -d
#   ./scripts/bootstrap.sh # 初始化管理账号 + 渠道 + 测试 API key
#   ./scripts/smoke-test.sh
name: ai4s

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai4s-postgres
    environment:
      POSTGRES_DB: axonhub
      POSTGRES_USER: axonhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai4s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonhub -d axonhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  axonhub:
    image: looplj/axonhub:v1.0.0-beta6
    container_name: ai4s-axonhub
    environment:
      # 环境变量优先级高于配置文件（官方约定），基本配置仅 env 即可
      AXONHUB_DB_DIALECT: postgres
      AXONHUB_DB_DSN: postgres://axonhub:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/axonhub?sslmode=disable
    ports:
      # 管理面 / API 直连口（调试用）；员工流量走 agentgateway :3000
      - "127.0.0.1:8090:8090"
    networks:
      - ai4s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.4.1
    container_name: ai4s-agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./agentgateway/config.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "127.0.0.1:3000:3000" # 员工流量入口（唯一对员工的端口）
      - "127.0.0.1:15001:15001" # readiness 探针（/healthz/ready）
    networks:
      - ai4s
    depends_on:
      axonhub:
        condition: service_healthy
    restart: unless-stopped
    # 镜像为 chainguard 最小底座，无 wget/curl，容器内无法做 exec 式 healthcheck；
    # 健康判定用宿主机 curl http://localhost:15001/healthz/ready（smoke-test.sh 内含）。

  # 前端静态托管（issue #9）：web/dist（vendor 的 axonhub 前端独立构建产物）
  web-static:
    image: nginx:1.27-alpine
    container_name: ai4s-web-static
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./web-static/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai4s
    restart: unless-stopped

  # 商密词表检测（issue #6）：agentgateway webhook → shim → Presidio
  presidio:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    container_name: ai4s-presidio
    networks:
      - ai4s
    restart: unless-stopped
    # 仅 shim 内部调用，不暴露宿主端口

  shim:
    build: ../shim
    container_name: ai4s-shim
    environment:
      PRESIDIO_URL: http://presidio:3000
      WORDLIST_PATH: /dlp/confidential-terms.json
    volumes:
      - ./dlp:/dlp:ro # 词表挂载，修改即热更新（shim 每请求重读）
      - ../recognizers:/recognizers:ro # PII recognizer 定义（issue #15），热更新
    networks:
      - ai4s
    depends_on:
      - presidio
    restart: unless-stopped

  # 占位/mock 上游：仅在拿不到 OAuth 订阅凭据时验证链路可达用。
  # 不参与默认启动；需要时 `docker compose --profile mock up -d`。
  mock-upstream:
    image: python:3.12-alpine
    profiles: ["mock"]
    container_name: ai4s-mock-upstream
    command: ["python3", "/server.py"]
    volumes:
      - ./mock-upstream/server.py:/server.py:ro
    networks:
      - ai4s
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

networks:
  ai4s:
    driver: bridge
