# ai4s 阶段 0 全链路 tracer bullet
# 链路：员工 curl/CLI → agentgateway(:3000) → axonhub（容器内网 :8090，宿主不暴露） → OAuth 订阅上游（或 mock 上游）
# 版本纪律（ADR-0002）：镜像 tag 显式 pin，不跟 latest/unstable；升级走评审。
#
# 用法：
#   cp .env.example .env   # 填入 DB_PASSWORD 与管理面账号
#   docker compose up -d
#   ./scripts/bootstrap.sh # 初始化管理账号 + 渠道 + 测试 API key
#   ./scripts/smoke-test.sh
name: ai4s

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai4s-postgres
    environment:
      POSTGRES_DB: axonhub
      POSTGRES_USER: axonhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai4s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonhub -d axonhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  axonhub:
    image: looplj/axonhub:v1.0.0-beta6
    container_name: ai4s-axonhub
    environment:
      # 环境变量优先级高于配置文件（官方约定），基本配置仅 env 即可
      AXONHUB_DB_DIALECT: postgres
      AXONHUB_DB_DSN: postgres://axonhub:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/axonhub?sslmode=disable
    volumes:
      - ./axonhub/config.yml:/etc/axonhub/config.yml:ro
    # 宿主调试口 :8090 已收（issue #60）：宿主脚本统一走 agentgateway :3000（/admin /oauth /v1 反代，功能等价）；
    # 容器内仍监听 8090，栈内链路（agentgateway/shim → axonhub:8090）与健康检查不受影响
    networks:
      - ai4s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    container_name: ai4s-agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      # 目录挂载（issue #33）：单文件 bind mount 下 shim 原子写（os.replace 换 inode）后容器内不可见、
      # watch 不触发热重载；目录挂载共享目录项，rename 语义跨容器正常，与 k8s ConfigMap 同原理。
      # 需 rw：ro 时 docker 无法在其中创建 mtls 嵌套挂载点；agentgateway File 模式本身不写配置。
      - ./agentgateway:/etc/agentgateway
      - ./.local/mtls:/etc/agentgateway/mtls:ro # mTLS 证书（issue #28，gitignored）
    ports:
      - "127.0.0.1:3000:3000" # 员工流量入口（唯一对员工的端口）
      - "127.0.0.1:3443:3443" # mTLS 设备身份入口（issue #28，客户端证书校验）
      - "127.0.0.1:15001:15001" # readiness 探针（/healthz/ready）
    networks:
      - ai4s
    depends_on:
      axonhub:
        condition: service_healthy
    restart: unless-stopped
    # 镜像为 chainguard 最小底座，无 wget/curl，容器内无法做 exec 式 healthcheck；
    # 健康判定用宿主机 curl http://localhost:15001/healthz/ready（smoke-test.sh 内含）。

  # 前端静态托管（issue #9）：web/dist（vendor 的 axonhub 前端独立构建产物）
  web-static:
    image: nginx:1.27-alpine
    container_name: ai4s-web-static
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./web-static/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai4s
    restart: unless-stopped

  # Casdoor SSO 枢纽（issue #14）：飞书 OAuth → 标准 OIDC → axonhub
  casdoor:
    image: casbin/casdoor:3.133.0
    container_name: ai4s-casdoor
    volumes:
      - ./casdoor/app.conf:/conf/app.conf:ro
      - casdoor_data:/data
    ports:
      - "127.0.0.1:8000:8000" # 仅本机/同机 nginx 反代可达（2026-09-03 起取消内网直连，收敛至全栈统一回环纪律）
    networks:
      - ai4s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 商密词表检测（issue #6）：agentgateway webhook → shim → Presidio
  presidio:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    container_name: ai4s-presidio
    networks:
      - ai4s
    restart: unless-stopped
    # 仅 shim 内部调用，不暴露宿主端口

  shim:
    build: ../shim
    container_name: ai4s-shim
    ports:
      - "127.0.0.1:18080:8080" # 仅本地：DLP 回归/语义层直测用（issue #20/#21）
    environment:
      PRESIDIO_URL: http://presidio:3000
      WORDLIST_PATH: /dlp/confidential-terms.json
      # issue #17：axonhub webhook → 飞书适配器（签名+重试）；值在 .env，不落库
      FEISHU_ALERT_WEBHOOK: ${FEISHU_ALERT_WEBHOOK:-}
      FEISHU_ALERT_SECRET: ${FEISHU_ALERT_SECRET:-}
      # issue #21 语义层 shadow：judge 经 axonhub 直连调 deepseek-flash（测试期，合成样本）；
      # issue #93 起确定外部 API 路线（无内网机型）——judge 输入先经 L1/L2 掩码脱敏再外发，
      # settings 加 sample_rate/max_concurrency 采样与并发预算。issue #35 起开关/模型/超时/prompt
      # 生效值以 /dlp/settings.json 为准（GET/PUT /dlp-admin/settings 维护，热生效），env 仅作回退层
      JUDGE_ENABLED: ${JUDGE_ENABLED:-0}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-http://axonhub:8090/v1}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-} # 凭据永远只走 env，禁止写入 settings.json
      JUDGE_MODEL: ${JUDGE_MODEL:-deepseek-v4-flash}
      # issue #29 EDM 文档指纹（PoC）；issue #35 起开关/阈值以 /dlp/settings.json 为准，env 回退
      EDM_ENABLED: ${EDM_ENABLED:-0}
      EDM_MIN_HITS: ${EDM_MIN_HITS:-2}
      # issue #30 PromptGuard 2 注入检测 shadow（检出记日志不阻断）；开关/阈值同上走 settings.json
      # issue #67：promptguard 服务并入 shim 进程内推理（pg_engine），PG_URL 退役；
      # 模型经下方卷挂载 + HF_HUB_OFFLINE 离线加载（原 promptguard 容器同款）
      PG_ENABLED: ${PG_ENABLED:-0}
      PG_THRESHOLD: ${PG_THRESHOLD:-0.7}
      HF_HUB_OFFLINE: "1"
      # issue #44 打分前置归一化（base64 内联解码/零宽清除/全角转半角，只改打分输入）：
      # settings.json 现网显式 true（实测检出 9→11/27、零误报抬升），env 回退层默认 1 对齐现网；
      # shim 代码内置默认 false 保升级安全（settings > env > 内置默认 三级取值语义不变）
      PG_NORMALIZE: ${PG_NORMALIZE:-1}
      # issue #40 分层总开关（L1 格式规则/L2 词表+PII/响应侧）；生效值以 /dlp/settings.json 为准，
      # env 仅作回退层——默认 1（开）保现网行为，与 JUDGE 等默认 0 的 shadow 层语义相反
      L1_ENABLED: ${L1_ENABLED:-1}
      L2_ENABLED: ${L2_ENABLED:-1}
      RESPONSE_ENABLED: ${RESPONSE_ENABLED:-1}
      # issue #127：L2 内嵌 OPF（privacy-filter）第二检测器；生效开关以 /dlp/settings.json
      # l2.opf.enabled 为准（默认关），env OPF_ENABLED=1 仅在 settings 无 opf 子节时回退启用
      OPF_URL: http://opf:8081
      OPF_ENABLED: ${OPF_ENABLED:-}
      # issue #56 告警巡检并入（原 alert-poller 容器，daemon 线程 30s 轮询，与检测路径隔离）：
      # DLP fail-open 探活 + 上游渠道/员工 key 额度（issue #17/#18）+ 提额审批同步（issue #19）；
      # SHIM_URL 探活默认进程内自调 http://localhost:8080，无需配置
      AXONHUB_BASE: http://axonhub:8090
      AXONHUB_ADMIN_EMAIL: ${AXONHUB_ADMIN_EMAIL:?AXONHUB_ADMIN_EMAIL is required}
      AXONHUB_ADMIN_PASSWORD: ${AXONHUB_ADMIN_PASSWORD:?AXONHUB_ADMIN_PASSWORD is required}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      APPROVAL_QUOTA_CODE: ${APPROVAL_QUOTA_CODE:-}
      # issue #72：新建 Key 审批定义（与提额审批并存，approval_sync 泛化轮询）
      APPROVAL_KEY_CODE: ${APPROVAL_KEY_CODE:-}
      # issue #72：createAPIKey 无 userID 入参（v1.0.0-beta6 实证），key 归申请人靠建后 SQL 直改；
      # 仅该步骤使用（函数级懒加载 psycopg），置空则归属步骤跳过、回执提示人工核对
      AXONHUB_DB_DSN: postgres://axonhub:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/axonhub?sslmode=disable
      # issue #79：控制台 Key 申请通道——管理员审批卡收件人（app bot 私信 open_id），
      # 置空则审批通知降级为群 webhook 文本；卡片按钮落点/超时秒数有代码默认，一般不动
      FEISHU_ADMIN_OPEN_ID: ${FEISHU_ADMIN_OPEN_ID:-}
      KEY_REQUEST_CONSOLE_URL: ${KEY_REQUEST_CONSOLE_URL:-}
      KEY_REQUEST_TTL: ${KEY_REQUEST_TTL:-}
      POLL_INTERVAL: "30"
    volumes:
      - ./dlp:/dlp:rw # 词表/format-rules/settings.json 挂载（issue #31 起 rw：admin API 写回）；shim 每请求重读热更新
      - ../recognizers:/recognizers:rw # PII recognizer 定义（issue #15），issue #31 起 rw
      - ./edm:/edm:rw # EDM 指纹库（issue #29），issue #31 起 rw
      - ./agentgateway:/agentgateway:rw # L1 规则渲染写回（issue #33 用，#31 预挂）
      - ./.local/alert-state:/state # 告警防抖状态（issue #56 平移自 alert-poller，gitignored）
      - ./.local/promptguard-model:/models/promptguard:ro # PromptGuard 2 模型（issue #67 平移自 promptguard 服务，gitignored）
    networks:
      - ai4s
    depends_on:
      - presidio
      - axonhub
    restart: unless-stopped

  # privacy-filter（OPF）中文 PII NER sidecar（issue #127）：L2 内嵌第二检测器预接入。
  # 不参与默认启动（#122 实测 torch CPU 延迟不可用）；需要时
  # `docker compose --profile opf up -d opf` + PUT settings l2.opf.enabled=true（详见 README）。
  opf:
    build: ../opf
    profiles: ["opf"]
    container_name: ai4s-opf
    environment:
      OPF_DEVICE: ${OPF_DEVICE:-cpu}
    volumes:
      # 模型 checkpoint 卷（首启自动下载 ~1.5GB 至 /root/.opf/privacy_filter；persist 防重下）
      - opf_model:/root/.opf
    networks:
      - ai4s
    restart: unless-stopped
    # 仅 shim 内部调用，不暴露宿主端口

  # 占位/mock 上游：仅在拿不到 OAuth 订阅凭据时验证链路可达用。
  # 不参与默认启动；需要时 `docker compose --profile mock up -d`。
  mock-upstream:
    image: python:3.12-alpine
    profiles: ["mock"]
    container_name: ai4s-mock-upstream
    command: ["python3", "/server.py"]
    volumes:
      - ./mock-upstream/server.py:/server.py:ro
    networks:
      - ai4s
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  casdoor_data:
  opf_model: # issue #127：OPF 模型 checkpoint 持久卷（profile=opf 才使用）

networks:
  ai4s:
    driver: bridge
