# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# agentgateway v1.4.1 standalone 配置（schema: https://raw.githubusercontent.com/agentgateway/agentgateway/v1.4.1/schema/config.json）
#
# ai4s 阶段 0：透传 + Secrets reject（issue #5）。
# 分层职责（契约 docs/contracts/dlp-webhook-shim.md）：
#   L1 本地 regex（本文件）——Secrets，永远生效，无外部依赖
#   L2 shim → Presidio（PII/商密，fail-open）——后续票据接入
config:
  # readiness 探针服务，健康判定：GET /healthz/ready
  readinessAddr: 0.0.0.0:15001

gateways:
  default:
    port: 3000
    protocol: HTTP

routes:
  # /v1：LLM 流量。ai policy 将该路由标记为 LLM 处理域，挂 Secrets promptGuard。
  # 阻断语义：reject 返回 451 + 规则 ID，且不触发渠道切换（agentgateway 层直接终答，请求不进入 axonhub）。
  - matches:
      - path:
          pathPrefix: /v1
    policies:
      ai:
        promptGuard:
          request:
            # 注意顺序：更具体的模式在前（Rust regex 无负前瞻，sk-ant- 会被 openai 通配命中）
            - regex:
                action: reject
                rules:
                  - pattern: 'sk-ant-[A-Za-z0-9_\-]{20,}'
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: Anthropic secret key detected","type":"content_policy_violation","code":"secrets.anthropic_sk"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'sk-(proj-)?[A-Za-z0-9_\-]{20,}'
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: OpenAI secret key detected","type":"content_policy_violation","code":"secrets.openai_sk"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'gh[pousr]_[A-Za-z0-9]{20,}'
                  - pattern: 'github_pat_[A-Za-z0-9_]{20,}'
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: GitHub token detected","type":"content_policy_violation","code":"secrets.github_token"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'AKIA[0-9A-Z]{16}'
                  - pattern: 'ASIA[0-9A-Z]{16}'
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: AWS access key detected","type":"content_policy_violation","code":"secrets.aws_key"}}
            - regex:
                action: reject
                rules:
                  - pattern: '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: private key material detected","type":"content_policy_violation","code":"secrets.private_key"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'LTAI[A-Za-z0-9]{12,}'
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: Aliyun access key detected","type":"content_policy_violation","code":"secrets.aliyun_ak"}}
            # L2：商密词表（shim → Presidio；fail-open 分级，契约 docs/contracts/dlp-webhook-shim.md）
            - webhook:
                target:
                  host: shim:8080
                failureMode: failOpen
    backends:
      # AI backend：把 axonhub 声明为 OpenAI 协议上游（hostOverride），LLM 处理域生效
      - ai:
          name: axonhub
          provider:
            openAI: {}
          hostOverride: axonhub:8090

  # catch-all：其余路径（/admin、/oauth、/health 等）原样透传到 axonhub
  - backends:
      - host: axonhub:8090
