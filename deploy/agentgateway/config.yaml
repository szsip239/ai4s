# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# agentgateway v1.4.1 standalone 配置（schema: https://raw.githubusercontent.com/agentgateway/agentgateway/v1.4.1/schema/config.json）
#
# ai4s DLP 分层职责（唯一事实来源：契约 docs/contracts/dlp-webhook-shim.md）：
#   L1/L1.5 本地 regex——规则源 deploy/dlp/format-rules.json（issue #33，经 admin API 渲染进下方标记区块，勿手改）；
#   默认常开、无外部依赖；l1.enabled=false（issue #40 总开关）整层撤防——密钥拦截全敞口，下方标记区块联动渲染为空
#   L2 shim → Presidio（PII/商密，fail-open 分级）——已经下方 webhook 接入（issue #15 请求侧 / #23 响应侧），
#   l2.enabled 总开关同 #40；L3 EDM 语料、judge、PG 注入检测（judge/PG 为 shadow 只记不拦）全在 shim 内，不经本文件
config:
  # readiness 探针服务，健康判定：GET /healthz/ready
  readinessAddr: 0.0.0.0:15001
routes:
  # /v1：LLM 流量。ai policy 将该路由标记为 LLM 处理域，挂 Secrets promptGuard。
  # 阻断语义：reject 返回 451 + 规则 ID，且不触发渠道切换（agentgateway 层直接终答，请求不进入 axonhub）。
  - gateways: [default, mtls]
    matches:
      - path:
          pathPrefix: /v1
    policies:
      # auto 智能路由插入点（issue #115 spike）：extAuthz(HTTP) 调 shim /classify 桩分类。
      # 协议语义：shim 任何输入恒 200（2xx=放行；非 2xx 会被当 deny 决策直回客户端——
      # failureMode=allow 只管传输层失败）；响应头 x-resolved-model 经 metadata CEL 存为
      # extauthz.resolved_model，供下方 ai.transformations 改写 model 用。
      # 执行顺序（v1.4.1 源码实证 httpproxy.rs apply_request_policies → llm read_body）：
      # extAuthz → extProc → ai.transformations → modelAliases → promptGuard webhook（DLP）。
      extAuthz:
        host: shim:8080
        failureMode: allow  # fail-open：shim 不可达 → 无 extauthz 变量 → CEL 回退 → modelAliases 兜底
        includeRequestBody:
          maxRequestBytes: 65536  # 默认 8192 对长 prompt 太小；超限截断 → shim 解析失败 → 无头回退
          allowPartialMessage: true
        protocol:
          http:
            path: '"/classify"'
            metadata:
              resolved_model: 'response.headers["x-resolved-model"]'
      ai:
        # auto→旗舰静态兜底（spike 定稿）：extAuthz fail-open / 桩未给出改写目标时，
        # transformations 回退保留原 model="auto"，由本别名映射到旗舰模型（顺序：先 transformations 后 alias）
        modelAliases:
          auto: gpt-5.6-luna
        # CEL 可见 extauthz.*（extAuthz metadata）与 llmRequest.*（请求体原文）；
        # 无改写目标时回退原 model——注意 eval 失败会删 model 键，故必须 has() 守卫不抛错
        transformations:
          model: 'has(extauthz.resolved_model) && extauthz.resolved_model != null && extauthz.resolved_model != "" ? extauthz.resolved_model : llmRequest.model'
        promptGuard:
          request:
            # >>> DLP-FORMAT-RULES BEGIN（format-rules.json 渲染，勿手改；顺序敏感：更具体的 pattern 在前） >>>
            - regex:
                action: reject
                rules:
                  - pattern: 'sk-ant-[A-Za-z0-9_\-]{20,}'
              scope:
                - systemPrompt
                - messages
                - toolInput
                - toolOutput
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: Anthropic secret key detected","type":"content_policy_violation","code":"secrets.anthropic_sk"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'sk-(proj-)?[A-Za-z0-9_\-]{20,}'
              scope:
                - systemPrompt
                - messages
                - toolInput
                - toolOutput
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: OpenAI secret key detected","type":"content_policy_violation","code":"secrets.openai_sk"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'gh[pousr]_[A-Za-z0-9]{20,}'
                  - pattern: 'github_pat_[A-Za-z0-9_]{20,}'
              scope:
                - systemPrompt
                - messages
                - toolInput
                - toolOutput
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: GitHub token detected","type":"content_policy_violation","code":"secrets.github_token"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'AKIA[0-9A-Z]{16}'
                  - pattern: 'ASIA[0-9A-Z]{16}'
              scope:
                - systemPrompt
                - messages
                - toolInput
                - toolOutput
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: AWS access key detected","type":"content_policy_violation","code":"secrets.aws_key"}}
            - regex:
                action: reject
                rules:
                  - pattern: '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
              scope:
                - systemPrompt
                - messages
                - toolInput
                - toolOutput
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: private key material detected","type":"content_policy_violation","code":"secrets.private_key"}}
            - regex:
                action: reject
                rules:
                  - pattern: 'LTAI[A-Za-z0-9]{12,}'
              scope:
                - systemPrompt
                - messages
                - toolInput
                - toolOutput
              rejection:
                status: 451
                headers:
                  set:
                    content-type: "application/json"
                body: |
                  {"error":{"message":"Blocked by ai4s DLP: Aliyun access key detected","type":"content_policy_violation","code":"secrets.aliyun_ak"}}
            - regex:
                action: mask
                rules:
                  - pattern: '\b1[3-9]\d{9}\b'
            - regex:
                action: mask
                rules:
                  - pattern: '\b\d{17}[\dXx]\b'
            # <<< DLP-FORMAT-RULES END <<<
            # L2：商密词表（shim → Presidio；fail-open 分级，契约 docs/contracts/dlp-webhook-shim.md）
            - webhook:
                target:
                  host: shim:8080
                failureMode: failOpen
                # issue #116：把 llmRequest.model 注入 webhook 请求头（v1.4.1 headers CEL，
                # 上游 webhook.rs 测试实证形状）——webhook body 协议不含 model 字段，
                # shim 三处 shadow_log 模型名此前恒为 None；头是 shim 侧模型名权威来源
                headers:
                  x-model: llmRequest.model
          # 响应侧（issue #23）：模型应答过 shim /response，命中即 mask（不 451，避免员工看到莫名错误）；
          # fail-open 同契约分级；流式应答覆盖见 streaming 段
          response:
            - webhook:
                target:
                  host: shim:8080
                failureMode: failOpen
          streaming: Enabled
    backends:
      # AI backend：把 axonhub 声明为 OpenAI 协议上游（hostOverride），LLM 处理域生效
      - ai:
          name: axonhub
          provider:
            openAI: {}
          hostOverride: axonhub:8090

  # /admin、/oidc、/oauth：axonhub 管理 API、SSO/OIDC 回调、OAuth 流程（契约 docs/contracts/ingress-proxy.md）
  # 例外（issue #68 P2-D）：/admin/requests/:id/content 在上游 v1.0.0-beta6 零 scope 校验、只比对自填
  # X-Project-ID 项目头。内容存储当前未启用（admin 也 404），网关侧整体 403 先行关闭，零功能损失；
  # 待上游补 scope 校验或启用内容存储时须先修上游再移除此规则。/preview 为 playground 实时流，不在此列。
  # 匹配段用 .+ 而非 [^/]+：请求 id 可能是含斜杠的 raw gid（gid://axonhub/Request/1）。
  - gateways: [default, mtls]
    matches:
      - path:
          regex: '^/admin/requests/.+/content$'
    policies:
      directResponse:
        status: 403
  - gateways: [default, mtls]
    matches:
      - path:
          pathPrefix: /admin
    backends:
      - host: axonhub:8090

  # 例外：/oauth/oidc/idp-callback 是前端 SPA 页面路由（web/dist 内），不是后端 API。
  # 若落到 axonhub 会拿到其内嵌旧版 index.html（引用不存在的旧 bundle，页面空白）。
  # exact 精确匹配优先于 /oauth 前缀匹配。
  - gateways: [default, mtls]
    matches:
      - path:
          exact: /oauth/oidc/idp-callback
    backends:
      - host: web-static:80

  - gateways: [default, mtls]
    matches:
      - path:
          pathPrefix: /oauth
    backends:
      - host: axonhub:8090

  # DLP 统一配置 admin API（issue #31）：shim 管理面；仅 default 网关（admin 不经 mTLS 设备口）
  - gateways: [default]
    matches:
      - path:
          pathPrefix: /dlp-admin
    backends:
      - host: shim:8080

  # 员工自助端点（issue #74）：/self/keys 本人 key 列表（shim 内省鉴权，无明文）；仅 default 网关
  - gateways: [default]
    matches:
      - path:
          pathPrefix: /self
    backends:
      - host: shim:8080

  # catch-all：前端静态（web/dist，nginx SPA fallback）
  - gateways: [default, mtls]
    backends:
      - host: web-static:80

gateways:
  default:
    port: 3000
    protocol: HTTP
  # mTLS 设备身份（issue #28）：客户端证书由 deploy/.local/mtls/ca.crt 校验。
  # 与 :3000 共用全部路由（下方 YAML 锚点 &shared_routes，防双份漂移）；生产 HTTPS 终结形态的前身
  mtls:
    port: 3443
    protocol: HTTPS
    tls:
      cert: /etc/agentgateway/mtls/server.crt
      key: /etc/agentgateway/mtls/server.key
      root: /etc/agentgateway/mtls/ca.crt


